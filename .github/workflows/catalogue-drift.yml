name: Catalogue drift check

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Fetch canonical forgesworn-repos.json
        run: curl -fsSL https://raw.githubusercontent.com/forgesworn/.github/main/forgesworn-repos.json -o forgesworn-repos.json

      - name: Check catalogue against live org
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-catalogue-drift.mjs
